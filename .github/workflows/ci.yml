name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra lab
      - run: uv run python -m unittest discover tests

  lab-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: lab-ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
