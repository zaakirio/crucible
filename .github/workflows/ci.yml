name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"
          enable-cache: true

      - run: uv sync --frozen

      - run: uv run python -m unittest discover -s tests -p 'test_*.py'

      - run: uv run python -m compileall -q src scripts
