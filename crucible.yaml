db: results.db
tests: tests
docs: docs/rag
hardware: m4-pro-24gb
gate:
  max_drop_pp: 5          # fail if capability drops more than this vs baseline
  max_refusal_shift_pp: 5 # fail if refusal INCREASES more than this (over-refusal creep); drops never fail

# Per-suite generation budget. Thinking/reasoning models need headroom for chain-of-thought
# before writing any content. 2048 covers most cases; reduce for non-thinking models.
suite_defaults:
  gsm8k:        {max_tokens: 2048}
  gsm_symbolic: {max_tokens: 2048}
  math:         {max_tokens: 2048}
  code:         {max_tokens: 2048}
  sorrybench:   {max_tokens: 2048}
  orbench:      {max_tokens: 2048}
  xstest:       {max_tokens: 2048}
  falsereject:  {max_tokens: 2048}
  refusal:      {max_tokens: 2048}
