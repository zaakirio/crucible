[project]
name = "crucible-eval"
version = "0.1.0"
description = "What survives quantization and abliteration - an eval harness for self-hostable models."
readme = "README.md"
license = "MIT"
authors = [{ name = "Zaakir" }]
keywords = ["llm", "evaluation", "llama.cpp", "gguf", "quantization", "abliteration"]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "matplotlib>=3.10.9",
    "pyyaml>=6.0",
]

[project.urls]
Repository = "https://github.com/zaakirio/crucible"

[project.scripts]
crucible = "crucible.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crucible"]
