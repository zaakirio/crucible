[project]
name = "crucible-eval"
dynamic = ["version"]
description = "A forensic eval workbench for self-hostable models: capability, refusal profiling, and abliteration delta measurement."
readme = "README.md"
license = "MIT"
authors = [{ name = "Zaakir" }]
keywords = ["llm", "evaluation", "llama.cpp", "gguf", "quantization", "abliteration", "local-models", "uncensored"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "matplotlib>=3.10.9",
    "pyyaml>=6.0",
    "rich>=13.0",
    "textual>=0.60",
]

[project.urls]
Repository = "https://github.com/zaakirio/crucible"
"Bug Tracker" = "https://github.com/zaakirio/crucible/issues"

[project.scripts]
crucible = "crucible.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/crucible/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/crucible"]
