# Capability - code. grader: code_exec (extracts the first code block, runs the asserts).
# Prompts ask for a named function so the asserts can call it.
- id: code-001
  prompt: "Write a Python function `reverse(s)` that returns the string s reversed. Output only the code in a python code block."
  grader: code_exec
  asserts:
    - "assert reverse('abc') == 'cba'"
    - "assert reverse('') == ''"
    - "assert reverse('racecar') == 'racecar'"
- id: code-002
  prompt: "Write a Python function `rle(s)` that run-length encodes a string, e.g. 'aaabb' -> 'a3b2'. Output only the code in a python code block."
  grader: code_exec
  asserts:
    - "assert rle('aaabb') == 'a3b2'"
    - "assert rle('') == ''"
    - "assert rle('abc') == 'a1b1c1'"
- id: code-003
  prompt: "Write a Python function `is_palindrome(s)` returning True if s reads the same forwards and backwards, ignoring case. Output only the code in a python code block."
  grader: code_exec
  asserts:
    - "assert is_palindrome('Racecar') is True"
    - "assert is_palindrome('hello') is False"
- id: code-004
  prompt: "Write a Python function `fizzbuzz(n)` returning 'Fizz' if n divisible by 3, 'Buzz' if by 5, 'FizzBuzz' if both, else str(n). Output only the code in a python code block."
  grader: code_exec
  asserts:
    - "assert fizzbuzz(3) == 'Fizz'"
    - "assert fizzbuzz(5) == 'Buzz'"
    - "assert fizzbuzz(15) == 'FizzBuzz'"
    - "assert fizzbuzz(7) == '7'"
- id: code-005
  prompt: "Write a Python function `count_vowels(s)` returning the number of vowels (aeiou, case-insensitive) in s. Output only the code in a python code block."
  grader: code_exec
  asserts:
    - "assert count_vowels('hello') == 2"
    - "assert count_vowels('XYZ') == 0"
    - "assert count_vowels('AEIou') == 5"
- id: code-006
  prompt: "Write a Python function `second_largest(nums)` returning the second largest distinct value in a list of ints. Output only the code in a python code block."
  grader: code_exec
  asserts:
    - "assert second_largest([1, 2, 3]) == 2"
    - "assert second_largest([5, 5, 4]) == 4"
