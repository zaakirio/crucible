# GSM-Symbolic (apple/GSM-Symbolic; Mirzadeh et al., ICLR 2025) — contamination-resistant
# math: regenerated instances of GSM8K-style templates. Use these for ABSOLUTE capability
# claims; gsm8k.yaml stays for paper-comparable deltas. One instance per original template,
# deterministic sample of 20 via scripts/seed_tests.py (seed 20260610).
- id: gsmsym-001
  prompt: Amelia walks 24 kilometers every day on her favorite walking trail, which includes 11 kilometers
    of walking on the beach and 13 kilometers of walking on the sidewalk. On the sidewalk, Amelia walks
    at two times the rate of speed that she does on the beach. If 44 minutes of her walk is spent on the
    beach, how long does it take for her to complete the entire 24-kilometer walk, in minutes? Give the
    final answer as just the number on the last line.
  grader: numeric
  expected: 70
  tolerance: 0.001
- id: gsmsym-002
