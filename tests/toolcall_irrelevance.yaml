                description: CSRF token cookie value.
            default: {}
          proxies:
            type: object
            description: Dictionary mapping protocol names to the URL of the proxy. Each key-value pair represents
              a protocol and its proxy URL.
            properties:
              http:
                type: string
                description: HTTP proxy URL.
              https:
                type: string
                description: HTTPS proxy URL.
            default: {}
          stream:
            type: boolean
            description: If True, the response should be streamed; otherwise, it should be downloaded immediately.
            default: false
          verify:
            type: boolean
            description: Whether to verify the server's TLS certificate.
            default: true
