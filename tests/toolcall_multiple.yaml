# Tool calling: choose the right function (2-4 offered).
# Sampled from BFCL v4 (Berkeley Function Calling Leaderboard; Patil et al.),
# github.com/ShishirPatil/gorilla, Apache 2.0. Deterministic sample via
# scripts/seed_tools.py (seed 20260610). Graded BFCL-AST style on llama-server's
# parsed tool_calls: name match, args within allowed value lists, all-or-nothing.
- id: tc-multiple-001
  bfcl_id: live_multiple_116-45-1
  prompt: Could you add 'read' permissions for user with principal ID 'user-123' to the resource with ID 'resource-456'?
  grader: tool_call
  expect_call: true
  tools:
  - type: function
    function:
      name: version_api_VersionApi_get_version
      description: Retrieve the current version information of the application, including the application name and
        its version number.
      parameters:
        type: object
        properties: {}
        required: []
  - type: function
    function:
      name: acl_api_add_mapping
      description: Adds an Access Control List (ACL) mapping to define permissions for a user or group.
      parameters:
        type: object
        required:
        - principal_id
        - resource_id
        - permissions
        properties:
          principal_id:
            type: string
            description: The unique identifier for the user or group.
          resource_id:
            type: string
            description: The unique identifier of the resource for which access is being defined.
          permissions:
            type: string
            description: The level of access being granted.
            enum:
            - read
            - write
            - delete
            - admin
  - type: function
    function:
      name: acl_api_delete_mapping
      description: Removes an ACL (Access Control List) mapping for a specified team and project.
      parameters:
        type: object
        required:
        - teamUuid
        - projectUuid
        properties:
          teamUuid:
            type: string
            description: The UUID of the team for which the ACL mapping is to be removed.
          projectUuid:
            type: string
            description: The UUID of the project for which the ACL mapping is to be removed.
  - type: function
    function:
      name: acl_api_AclApi_retrieve_projects
      description: Retrieve the list of projects assigned to a specified team, with options to exclude inactive
        projects and/or only include root projects.
      parameters:
        type: object
        required:
        - uuid
        properties:
          uuid:
            type: string
            description: The unique identifier of the team for which to retrieve project mappings.
          excludeInactive:
            type: boolean
            description: If true, inactive projects will not be included in the response.
            default: false
          onlyRoot:
            type: boolean
            description: If true, only root projects will be included in the response.
            default: false
  - type: function
    function:
      name: analysis_api_AnalysisApi_retrieve_analysis
      description: Retrieves the trail of analysis actions for a given vulnerability within a specified component
        of a project.
      parameters:
        type: object
        required:
        - project
        - component
        - vulnerability
        properties:
          project:
            type: string
            description: The UUID of the project to retrieve the analysis from. For example, '123e4567-e89b-12d3-a456-426614174000'.
          component:
            type: string
            description: The UUID of the component associated with the analysis. For example, '123e4567-e89b-12d3-a456-426614174001'.
          vulnerability:
            type: string
            description: The UUID of the vulnerability to retrieve the analysis trail for. For example, '123e4567-e89b-12d3-a456-426614174002'.
  expected_calls:
  - acl_api_add_mapping:
      principal_id:
      - user-123
      resource_id:
      - resource-456
      permissions:
      - read
- id: tc-multiple-002
  bfcl_id: live_multiple_785-173-7
  prompt: I need to talk to someone about how to deal with my boss at work. I would really appreciate your help
    locating a therapist. I'd like to find a therapist that works out of Sunnyvale.
  grader: tool_call
  expect_call: true
  tools:
  - type: function
    function:
      name: Services_4_BookAppointment
      description: Schedule an appointment with a specified therapist on a particular date and time.
      parameters:
        type: object
        required:
        - therapist_name
        - appointment_time
        - appointment_date
        properties:
          therapist_name:
            type: string
            description: The full name of the therapist with whom the appointment is to be booked.
          appointment_time:
            type: string
            description: The time at which the appointment is scheduled, in 24-hour format (e.g., '14:00').
          appointment_date:
            type: string
            description: The date on which the appointment is scheduled, in the format 'YYYY-MM-DD' (e.g., '2023-04-15').
  - type: function
    function:
      name: Services_4_FindProvider
      description: Find a suitable therapist in a specified city according to user's requirements.
      parameters:
        type: object
        required:
        - city
        - type
        properties:
          city:
            type: string
            description: The city where the user is searching for a therapist, in the format of 'City, State', such
              as 'Berkeley, CA' or 'New York, NY'.
          type:
            type: string
            description: The specialization of the therapist the user is looking for.
            enum:
            - Psychologist
            - Family Counselor
            - Psychiatrist
  - type: function
    function:
      name: Weather_1_GetWeather
      description: Retrieve the weather forecast for a specified city on a particular date.
      parameters:
        type: object
        required:
        - city
        properties:
          city:
            type: string
            description: The name of the city for which the weather forecast is requested, such as 'New York, NY'
              or 'Los Angeles, CA'.
          date:
            type: string
            description: The date for which the weather forecast is requested, in the format 'YYYY-MM-DD'. If not
              provided, the default value represents the current date.
            default: today
  expected_calls:
  - Services_4_FindProvider:
      city:
      - Sunnyvale, CA
      type:
      - Psychologist
