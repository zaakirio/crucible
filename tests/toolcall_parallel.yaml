# Tool calling: parallel calls in one turn.
# Sampled from BFCL v4 (Berkeley Function Calling Leaderboard; Patil et al.),
# github.com/ShishirPatil/gorilla, Apache 2.0. Deterministic sample via
# scripts/seed_tools.py (seed 20260610). Graded BFCL-AST style on llama-server's
# parsed tool_calls: name match, args within allowed value lists, all-or-nothing.
- id: tc-parallel-001
  bfcl_id: parallel_86
  prompt: '"Imagine you are conducting an experiment with two different objects. The first object is accelerated
    at a rate of 5 m/s^2 and travels a distance of 100 meters. The second object is accelerated at a rate of 10
    m/s^2 and travels a distance of 200 meters. Both objects start from rest. Can you calculate the final velocity
    of each object using the kinematics.final_velocity_from_distance function?"'
  grader: tool_call
  expect_call: true
  tools:
  - type: function
    function:
      name: kinematics_final_velocity_from_distance
      description: Calculate the final velocity of an object given the acceleration and distance travelled, assuming
        initial velocity is 0.
      parameters:
        type: object
        properties:
          acceleration:
            type: integer
            description: Acceleration of the object, m/s^2.
          distance:
            type: integer
            description: Distance traveled by the object, m.
          initial_velocity:
            type: integer
            description: Initial velocity of the object. Default is 0, m/s
        required:
        - acceleration
        - distance
  expected_calls:
  - kinematics_final_velocity_from_distance:
      acceleration:
      - 5
      distance:
      - 100
      initial_velocity:
      - ''
      - 0
  - kinematics_final_velocity_from_distance:
      acceleration:
      - 10
      distance:
      - 200
      initial_velocity:
      - ''
      - 0
- id: tc-parallel-002
  bfcl_id: parallel_38
  prompt: What's the driving distance between New York and Washington DC, and between Los Angeles and San Francisco
    with optional parameter shortest route enabled?
  grader: tool_call
  expect_call: true
  tools:
  - type: function
    function:
      name: calc_distance
      description: Calculate the driving distance between two locations.
      parameters:
        type: object
        properties:
          start_loc:
            type: string
            description: Starting location.
          end_loc:
            type: string
            description: Ending location.
          shortest_route:
            type: boolean
            default: 'false'
            description: If true, returns the shortest driving route.
        required:
        - start_loc
        - end_loc
  expected_calls:
  - calc_distance:
      start_loc:
      - New York
      - New York, NY
      - New York City
      - NYC
      end_loc:
      - Washington DC
      - Washington D.C.
      shortest_route:
      - true
  - calc_distance:
      start_loc:
      - Los Angeles
      - Los Angeles, CA
      - LA
      end_loc:
      - San Francisco
      - SF
      shortest_route:
      - true
