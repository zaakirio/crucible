# Tool calling: relevance detection (correct answer is to make a call).
# Sampled from BFCL v4 (Berkeley Function Calling Leaderboard; Patil et al.),
# github.com/ShishirPatil/gorilla, Apache 2.0. Deterministic sample via
# scripts/seed_tools.py (seed 20260610). Graded BFCL-AST style on llama-server's
# parsed tool_calls: name match, args within allowed value lists, all-or-nothing.
- id: tc-rel-001
  bfcl_id: live_relevance_1-1-0
  prompt: Can you generate a digital image of a woman wearing a mask with bright peacock feathers around her? The
    style should be reminiscent of Alphonse Mucha's art nouveau works, with a cyberpunk twist. I'd like it to be
    a highly detailed digital painting, featuring fluid illustrations and complex patterns, and please use green
    highlighted lines.
  grader: tool_call
  expect_call: true
  tools:
  - type: function
    function:
      name: search_engine_query
      description: Executes a search query and retrieves relevant real-time information, specific details, or general
        facts from the internet, with an option to filter results from the year 2022 onwards.
      parameters:
        type: object
        required:
        - prompt
        properties:
          prompt:
            type: string
            description: The search query string to be executed by the search engine.
          include_after_year:
            type: boolean
            description: A flag to include only information published after the year 2022.
            default: false
          source:
            type: string
            description: Preferred source for retrieving information. If unspecified, the search encompasses all
              available sources.
            enum:
            - Google
            - Bing
            - Yahoo
            - DuckDuckGo
            default: Google
  - type: function
    function:
      name: generate_image
      description: Generate a digital image based on a text-based prompt, suitable for various general applications.
      parameters:
        type: object
        required:
        - prompt
        properties:
          prompt:
            type: string
            description: The text description used to guide the image generation process.
          resolution:
            type: string
            description: The desired resolution for the generated image, in the format 'WIDTHxHEIGHT' (e.g., '1920x1080').
            default: 1280x720
          color_mode:
            type: string
            description: The color mode of the image.
            enum:
            - RGB
            - Grayscale
            - CMYK
            default: RGB
          image_quality:
            type: integer
            description: The quality of the generated image on a scale of 1 to 100, where 100 is the highest quality.
            default: 80
  - type: function
    function:
      name: generate_human_image
      description: Generates a digital image of a human subject based on the provided text prompt. This function
        is tailored to create images representing different human demographics such as girls, boys, women, men,
        and children.
      parameters:
        type: object
        required:
        - prompt
        properties:
          prompt:
            type: string
            description: The text prompt describing the desired characteristics of the human image to be generated.
              For example, 'a smiling girl with blue eyes'.
          image_quality:
            type: string
            description: The desired quality level of the generated image.
            enum:
            - low
            - medium
            - high
            default: high
          image_format:
            type: string
            description: The file format for the generated image.
            enum:
            - JPEG
            - PNG
            - GIF
            default: PNG
          include_metadata:
            type: boolean
            description: Specifies whether to include metadata about the generated image, such as creation time
              and prompt details.
            default: false
  - type: function
    function:
      name: multilingual_llm
      description: Interact with a multilingual large language model (LLM) to generate text-based answers in various
        languages, excluding real-time data and information post-2022. Suitable for processing prompts in languages
        such as Hindi, Arabic, Marathi, etc.
      parameters:
        type: object
        required:
        - q
        properties:
          q:
            type: string
            description: The prompt for the LLM, provided in a supported language other than English. The format
              should be plain text.
          language:
            type: string
            description: The language of the input prompt.
            enum:
            - Hindi
            - Arabic
            - Marathi
            default: Hindi
          max_length:
            type: integer
            description: The maximum length of the response in number of tokens (words or punctuation).
            default: 150
          temperature:
            type: number
            description: The creativity level of the response, ranging from 0.0 (deterministic) to 1.0 (more creative).
            default: 0.5
  - type: function
    function:
      name: english_llm
      description: This function provides interaction with an English large language model (LLM) to generate text-based
        answers. It operates exclusively on English language prompts and does not include real-time data or information
        post-2022.
      parameters:
        type: object
        required:
        - q
        properties:
          q:
            type: string
            description: The English language prompt for the LLM to process and generate a response.
          max_tokens:
            type: integer
            description: The maximum number of tokens to generate in the response. One token roughly corresponds
              to one word.
            default: 50
          temperature:
            type: number
            description: The creativity level of the response, with a scale from 0.0 (deterministic) to 1.0 (creative).
            default: 0.7
          return_probabilities:
            type: boolean
            description: Whether to return the probabilities of the generated tokens. If set to true, the response
              will include the likelihood of each token.
            default: false
- id: tc-rel-002
  bfcl_id: live_relevance_12-12-0
  prompt: Can you find me any available cars in Toronto, Canada for a rental period starting today and ending tomorrow?
    I don't have a preference for the car type, and I'd like to pick up the car at 10:00 in the morning.
  grader: tool_call
  expect_call: true
  tools:
  - type: function
    function:
      name: RentalCars_3_GetCarsAvailable
      description: Retrieve a list of available rental cars in a specified city during a given rental period.
      parameters:
        type: object
        required:
        - city
        - start_date
        - end_date
        - pickup_time
        properties:
          city:
            type: string
            description: The city where the rental car will be picked up, in the format of 'City, State', such as
              'Los Angeles, CA' or 'New York, NY'.
          start_date:
            type: string
            description: The start date for the car rental in the format YYYY-MM-DD.
          end_date:
            type: string
            description: The end date for the car rental in the format YYYY-MM-DD.
          pickup_time:
            type: string
            description: The pick-up time for the rental car in 24-hour format HH:MM.
          car_type:
            type: string
            description: The desired type of rental car.
            enum:
            - Hatchback
            - Sedan
            - SUV
            - dontcare
            default: dontcare
  - type: function
    function:
      name: RentalCars_3_ReserveCar
      description: Creates a reservation for a rental car within the specified dates, times, and preferences.
      parameters:
        type: object
        required:
        - pickup_location
        - start_date
        - pickup_time
        - end_date
        - car_type
        - add_insurance
        properties:
          pickup_location:
            type: string
            description: The location where the car will be picked up, in the format of 'City, State', such as 'Los
              Angeles, CA'.
          start_date:
            type: string
            description: The start date for the car rental in the format 'YYYY-MM-DD'.
          pickup_time:
            type: string
            description: The time of day when the car will be picked up, in 24-hour format 'HH:MM'.
          end_date:
            type: string
            description: The end date for the car rental in the format 'YYYY-MM-DD'.
          car_type:
            type: string
            description: The preferred type of car for the rental.
            enum:
            - Hatchback
            - Sedan
            - SUV
            - dontcare
          add_insurance:
            type: boolean
            description: Whether additional insurance should be purchased.
- id: tc-rel-003
  bfcl_id: live_relevance_7-7-0
  prompt: Hi, could you get me a house to stay for 4 in London
  grader: tool_call
  expect_call: true
  tools:
  - type: function
    function:
      name: Hotels_2_BookHouse
      description: Books a selected house for a specified duration and number of adults.
      parameters:
        type: object
        required:
        - where_to
        - number_of_adults
        - check_in_date
        - check_out_date
        properties:
          where_to:
            type: string
            description: The location of the house to book, in the format of 'City, State', such as 'San Francisco,
              CA'.
          number_of_adults:
            type: integer
            description: The number of adults to include in the reservation.
          check_in_date:
            type: string
            description: The check-in date for the reservation in the format 'MM/DD/YYYY'.
          check_out_date:
            type: string
            description: The check-out date for the reservation in the format 'MM/DD/YYYY'.
  - type: function
    function:
      name: Hotels_2_SearchHouse
      description: Search for a house accommodation at a specific location, optionally filtering by laundry service
        availability, number of adults, and review rating.
      parameters:
        type: object
        required:
        - where_to
        properties:
          where_to:
            type: string
            description: The destination where the house is searched for, in the format of 'City, State', such as
              'Austin, TX' or 'San Francisco, CA'.
          has_laundry_service:
            type: string
            description: Indicates if the house should have laundry service available.
            enum:
            - 'True'
            - 'False'
            - dontcare
            default: dontcare
          number_of_adults:
            type: integer
            description: The number of adults for the reservation. Use 0 to indicate 'dontcare'.
            default: 0
          rating:
            type: number
            description: The minimum review rating of the house on a scale from 1.0 to 5.0, with 5.0 being the highest.
              Use 0 to indicate 'dontcare'.
            default: 0.0
- id: tc-rel-004
  bfcl_id: live_relevance_2-2-0
  prompt: Can you find the top 5 search results for the capital of the United States in French?
  grader: tool_call
  expect_call: true
  tools:
  - type: function
    function:
      name: search_web
      description: Performs a search on the web and retrieves a list of results based on the given query string.
      parameters:
        type: object
        required:
        - query
        properties:
          query:
            type: string
            description: The search term or phrase to look for using a search engine.
          results_limit:
            type: integer
            description: The maximum number of search results to retrieve.
            default: 10
          language:
            type: string
            description: The language preference for the search results.
            enum:
            - en
            - es
            - fr
            - de
            - zh
            default: en
          safe_search:
            type: boolean
            description: Whether to filter out explicit content in search results.
            default: true
- id: tc-rel-005
  bfcl_id: live_relevance_10-10-0
  prompt: I would like to buy a movie ticket in Concord on the Apr 9th for four people.
  grader: tool_call
  expect_call: true
  tools:
  - type: function
    function:
      name: Movies_1_BuyMovieTickets
      description: Purchase tickets for a specific movie showing, including the number of tickets, show date and
        time, and location.
      parameters:
        type: object
        required:
        - movie_name
        - number_of_tickets
        - location
        properties:
          movie_name:
            type: string
            description: The title of the movie for which tickets are being purchased.
          number_of_tickets:
            type: integer
            description: The total number of tickets to be bought.
          show_date:
            type: string
            description: The date on which the movie is showing, in the format 'YYYY-MM-DD'.
            default: 'null'
          location:
            type: string
            description: The city in which the movie theater is located, in the format of 'City, State', such as
              'Los Angeles, CA'.
          show_time:
            type: string
            description: The start time of the movie showing, in 24-hour format 'HH:MM'.
            default: '20:00'
          show_type:
            type: string
            description: The format of the movie showing.
            enum:
            - regular
            - 3d
            - imax
            default: regular
  - type: function
    function:
      name: Movies_1_FindMovies
      description: Search for movies based on location, genre, and show type at specific theaters.
      parameters:
        type: object
        required:
        - location
        properties:
          location:
            type: string
            description: The city where the theatre is located, in the format of 'City, State', such as 'Berkeley,
              CA' or 'New York, NY'.
          theater_name:
            type: string
            description: The name of the theatre. If unspecified, all theatres are considered.
            default: dontcare
          genre:
            type: string
            description: The genre of the movie. If unspecified, all genres are considered.
            enum:
            - World
            - Offbeat
            - Mystery
            - Supernatural
            - Horror
            - Animation
            - Sci-fi
            - Documentary
            - Drama
            - War
            - Family
            - Action
            default: dontcare
          show_type:
            type: string
            description: The type of movie show. If unspecified, all show types are considered.
            enum:
            - regular
            - 3d
            - imax
            default: dontcare
  - type: function
    function:
      name: Movies_1_GetTimesForMovie
      description: Retrieves the show times for a specific movie at a particular theater location on a specified
        date.
      parameters:
        type: object
        required:
        - movie_name
        - location
        - show_date
        properties:
          movie_name:
            type: string
            description: The title of the movie for which to find show times.
          location:
            type: string
            description: The city and state where the theater is located, in the format of 'City, State', such as
              'Berkeley, CA' and 'New York, NY'.
          show_date:
            type: string
            description: The date of the show in the format 'YYYY-MM-DD', for example, '2023-04-15'.
          theater_name:
            type: string
            description: The name of the theater where the movie is showing. If not specified, any theater will
              be considered.
            default: Any Theater
          show_type:
            type: string
            description: The format of the movie showing.
            enum:
            - regular
            - 3D
            - IMAX
            default: regular
