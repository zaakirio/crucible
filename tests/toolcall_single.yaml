# Tool calling: single function, single call.
# Sampled from BFCL v4 (Berkeley Function Calling Leaderboard; Patil et al.),
# github.com/ShishirPatil/gorilla, Apache 2.0. Deterministic sample via
# scripts/seed_tools.py (seed 20260610). Graded BFCL-AST style on llama-server's
# parsed tool_calls: name match, args within allowed value lists, all-or-nothing.
- id: tc-single-001
  bfcl_id: simple_python_191
  prompt: Find me the 5 tallest mountains within 50km of Denver, Colorado.
  grader: tool_call
  expect_call: true
  tools:
  - type: function
    function:
      name: locate_tallest_mountains
      description: Find the tallest mountains within a specified radius of a location.
      parameters:
        type: object
        properties:
          location:
            type: string
            description: The city from which to calculate distance.
          radius:
            type: integer
            description: The radius within which to find mountains, measured in kilometers.
          amount:
            type: integer
            description: The number of mountains to find, listed from tallest to smallest.
        required:
        - location
        - radius
        - amount
  expected_calls:
  - locate_tallest_mountains:
      location:
      - Denver, Colorado
      - Denver
      - CO
      radius:
      - 50
      amount:
      - 5
- id: tc-single-002
  bfcl_id: simple_python_50
  prompt: What is the change in entropy in Joules per Kelvin of a 1kg ice block at 0°C if it is heated to 100°C
    under 1 atmosphere of pressure?
  grader: tool_call
  expect_call: true
  tools:
  - type: function
    function:
      name: entropy_change_calculate
      description: Calculate the change in entropy for a mass of a specific substance under set initial and final
        conditions.
      parameters:
        type: object
        properties:
          substance:
            type: string
            description: The substance for which the change in entropy is calculated.
          mass:
            type: integer
            description: The mass of the substance in kg.
          initial_temperature:
            type: integer
            description: The initial temperature of the substance in degree Celsius.
          final_temperature:
            type: integer
            description: The final temperature of the substance in degree Celsius.
          pressure:
            type: integer
            default: 1
            description: The pressure the substance is under in atmospheres.
        required:
        - substance
        - mass
        - initial_temperature
        - final_temperature
  expected_calls:
  - entropy_change_calculate:
      substance:
      - ice
      mass:
      - 1
      initial_temperature:
      - 0
      final_temperature:
      - 100
      pressure:
      - ''
      - 1
